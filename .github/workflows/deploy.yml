
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Tests
        run: mvn test

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/game2048:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/game2048:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull Image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/game2048:${{ github.sha }}

      - name: Update Kubernetes Deployment
        run: kubectl set image deployment/game2048 game2048=${{ secrets.DOCKERHUB_USERNAME }}/game2048:${{ github.sha }}

      - name: Wait For Rollout
        run: kubectl rollout status deployment/game2048

      - name: Show Pods
        run: kubectl get pods

      - name: Show Services
        run: kubectl get svc

